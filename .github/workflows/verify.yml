name: Vérifications Quartz

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer les sources et le modèle
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Vérifier Quartz
        run: ./Verifier.command
